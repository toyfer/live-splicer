name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild app.js from gzipped base64 payload
        run: |
          set -euo pipefail
          base64 -d app.js.gz.b64 | gunzip > app.js
          test "$(wc -c < app.js)" -gt 30000
          node --check app.js
      - name: Assemble site and download ffmpeg-core
        run: |
          set -euo pipefail
          mkdir -p site/core site/vendor site/lib
          core="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd"
          ff="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd"
          curl -fsSL -o site/core/ffmpeg-core.js "$core/ffmpeg-core.js"
          curl -fsSL -o site/core/ffmpeg-core.wasm "$core/ffmpeg-core.wasm"
          curl -fsSL -o site/vendor/ffmpeg.js "$ff/ffmpeg.js"
          curl -fsSL -o site/vendor/814.ffmpeg.js "$ff/814.ffmpeg.js"
          test "$(wc -c < site/core/ffmpeg-core.wasm)" -gt 1000000
          cp index.html app.js style.css site/
          curl -fsSL -o site/lib/fflate.mjs "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm"
          cp .nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
